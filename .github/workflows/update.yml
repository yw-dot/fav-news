name: update
on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST: ニュースとチャート
    - cron: "0 0 * * 5"    # 毎週金曜 9:00 JST: ニューリリースも更新
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            python update.py news
          else
            python update.py all
          fi
      - name: Commit
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "update"; git push
